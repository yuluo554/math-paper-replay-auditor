[project]
name = "math-paper-replay-auditor"
version = "0.1.2"
description = "数学论文可验证重放审计器——首个面向 openPangu-2.0-Flash 的论文数学断言审计工具"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "pydantic>=2.0",
    # sympy 的 LaTeX 解析器硬校验运行时版本必须为 4.11.x
    # （sympy/parsing/latex/_parse_latex_antlr.py 内 version().startswith('4.11')），
    # 放宽到 4.11–4.13 会让 pip 选到 4.13 → parse_latex 抛 ImportError
    # → 符号重放静默退化、illegal_derivation 类漏检（干净环境实测）。
    "antlr4-python3-runtime>=4.11,<4.12",
]

[project.optional-dependencies]
core = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "pydantic>=2.0",
    "antlr4-python3-runtime>=4.11,<4.12",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    # K58 门要真实构建 wheel（构建后装进干净 venv 验证"装完能用"）
    "build>=1.0",
]
gui = [
    "PySide6>=6.6.3.1",
]
build = [
    "PyInstaller>=6.22.3",
    "setuptools>=77",
]
all = [
    "math-paper-replay-auditor[core,dev,gui,build]",
]

[project.scripts]
auditor = "auditor.cli:main"

[project.entry-points."auditor.gui"]
main = "auditor.gui.main_window:run_gui"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

# D2（DEC2=A）：把 data/ 打进 wheel——pip 装完必须"能用"。
# data/ 在仓库根（不在 src/ 下），故显式映射为 **auditor.data** 子包
# （不装成顶层 `data` 包——那会往 site-packages 里塞一个极泛化的名字，
#  极易与第三方包撞名）。
# 注意：`[tool.setuptools.packages.find]` 与 `[tool.setuptools] packages` 互斥，
# 二者只能留其一——这里用显式清单 + package-dir 映射（包少且固定）。
[tool.setuptools]
package-dir = { "auditor" = "src/auditor", "auditor.data" = "data" }
packages = [
    "auditor",
    "auditor.benchmark",
    "auditor.core",
    "auditor.gui",
    "auditor.llm",
    "auditor.report",
    "auditor.data",
    "auditor.data.benchmark",
    "auditor.data.benchmark.generator",
    "auditor.data.knowledge",
    "auditor.data.real_papers",
]

[tool.setuptools.package-data]
"auditor.data" = [
    "benchmark/truth.json",
    "benchmark/manifest.json",
    "benchmark/whitelist.json",
    "benchmark/*/paper.tex",
    "knowledge/units.json",
    "real_papers/registry.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: 需要真实构建/安装的慢门（打包验证类）",
]
