[project]
name = "math-paper-replay-auditor"
version = "0.1.1"
description = "数学论文可验证重放审计器——首个面向 openPangu-2.0-Flash 的论文数学断言审计工具"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "pydantic>=2.0",
    # sympy 的 LaTeX 解析器硬校验运行时版本必须为 4.11.x
    # （sympy/parsing/latex/_parse_latex_antlr.py 内 version().startswith('4.11')），
    # 放宽到 4.11–4.13 会让 pip 选到 4.13 → parse_latex 抛 ImportError
    # → 符号重放静默退化、illegal_derivation 类漏检（干净环境实测）。
    "antlr4-python3-runtime>=4.11,<4.12",
]

[project.optional-dependencies]
core = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "pydantic>=2.0",
    "antlr4-python3-runtime>=4.11,<4.12",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
gui = [
    "PySide6>=6.6.3.1,<6.7",
]
build = [
    "PyInstaller>=6.22.3",
    "setuptools<81",
]
all = [
    "auditor[core,dev,gui,build]",
]

[project.scripts]
auditor = "auditor.cli:main"

[project.entry-points."auditor.gui"]
main = "auditor.gui.main_window:run_gui"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
